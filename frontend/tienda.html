<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda · ICFES Lab</title>
  <meta name="description" content="Personaliza tu personaje y consigue protectores de racha con tus monedas.">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#484ea2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/componentes.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/personaje.css">
  <link rel="stylesheet" href="/css/paginas/logros.css">
  <link rel="stylesheet" href="/css/paginas/tienda.css">
  <script src="/js/tema-inicial.js"></script>
  <script type="module" src="/js/paginas/tienda.js"></script>
</head>
<body class="app">
  <a class="saltar-contenido" href="#contenido">Saltar al contenido</a>
  <header id="cabecera" class="main-header"></header>
  <nav id="barra-lateral" class="sidebar-lateral"></nav>

  <main id="contenido" class="principal">
    <div class="encabezado-tienda">
      <div>
        <h1>Tienda</h1>
        <p>Gana monedas estudiando y úsalas para vestir a tu personaje y proteger tu racha.</p>
      </div>
      <aside class="tarjeta tarjeta-monedas" aria-label="Tus monedas">
        <div>
          <span class="rotulo">Tus monedas</span>
          <strong class="saldo" id="saldo"></strong>
        </div>
        <a class="btn btn-lima" href="/materias">Ganar más</a>
      </aside>
    </div>

    <div class="diseno-tienda">
      <aside class="columna-personaje">
        <article class="tarjeta vista-avatar" aria-label="Vista previa de tu personaje">
          <p class="nota-personaje">Tu personaje, <strong>tu estilo</strong></p>
          <div class="marco-avatar" id="vista-previa"></div>
          <p class="texto-sm texto-2" id="texto-vista">Elige un artículo para verlo en tu personaje.</p>
          <div class="look-actual">
            <span class="rotulo">Look actual</span>
            <div class="chips" id="look-actual"></div>
          </div>
          <button class="btn btn-primario btn-bloque" id="guardar-avatar" disabled>
            <svg class="icono" aria-hidden="true"><use href="/img/iconos.svg#save"></use></svg> Guardar personaje
          </button>
          <button class="btn btn-fantasma btn-bloque mt-4" id="restablecer-avatar" hidden>Deshacer cambios</button>
        </article>

        <article class="tarjeta tarjeta-paleta" id="seccion-color" aria-labelledby="titulo-paleta">
          <h2 id="titulo-paleta">Paleta de colores</h2>
          <p class="texto-sm texto-2">Elige el color de tu personaje.</p>
          <div class="paleta" id="paleta-colores"></div>
        </article>

        <article class="tarjeta tarjeta-monedas-ayuda" aria-labelledby="titulo-ganar">
          <h2 id="titulo-ganar">¿Cómo gano monedas?</h2>
          <ul class="lista-ganar" id="lista-ganar"></ul>
        </article>
      </aside>

      <div class="columna-catalogo">
        <nav class="navegacion-tienda" id="navegacion-tienda" aria-label="Secciones de la tienda"></nav>
        <section class="tarjeta seccion-tienda" id="seccion-expresion" aria-labelledby="titulo-expresion"></section>
        <section class="tarjeta seccion-tienda" id="seccion-accesorio" aria-labelledby="titulo-accesorio"></section>
        <section class="tarjeta seccion-tienda" id="seccion-fondo" aria-labelledby="titulo-fondo"></section>
        <section class="tarjeta seccion-tienda" id="seccion-protector" aria-labelledby="titulo-protector"></section>
        <section class="tarjeta seccion-evolucion" id="seccion-evolucion" aria-labelledby="titulo-evolucion"></section>
      </div>
    </div>
  </main>

  <nav id="nav-movil" class="nav-movil"></nav>
</body>
</html>
