<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña · ICFES Lab</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#484ea2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/componentes.css">
  <link rel="stylesheet" href="/css/paginas/auth.css">
  <script src="/js/tema-inicial.js"></script>
  <script type="module" src="/js/paginas/recuperar.js"></script>
</head>
<body>
  <div class="pagina-auth">
    <section class="panel-marca">
      <a href="/" aria-label="ICFES Lab, página principal">
        <img class="logo-imagen" src="/img/logo-icfes-lab.png" alt="ICFES Lab" width="520" height="140">
      </a>
      <div>
        <h1>¿Olvidaste tu contraseña? <span>Tranquilo</span>.</h1>
        <p>Te enviaremos un enlace seguro para crear una nueva. Tu progreso sigue intacto.</p>
      </div>
      <img src="/img/vanty.svg" alt="" class="vanty-marca">
    </section>

    <main class="panel-formulario" id="contenido">
      <div class="caja-formulario">
        <h2>Recuperar contraseña</h2>
        <p>Escribe el correo con el que te registraste.</p>
        <form class="tarjeta" id="formulario" novalidate>
          <div class="alerta alerta-error alerta-formulario oculto" role="alert" tabindex="-1"></div>
          <div class="campo">
            <label for="email">Correo electrónico</label>
            <input class="entrada" type="email" id="email" name="email" autocomplete="email" required maxlength="160" placeholder="tucorreo@ejemplo.com">
            <span class="campo-error" id="error-email"></span>
          </div>
          <button type="submit" class="btn btn-primario btn-lg btn-bloque" id="boton-enviar">Enviar enlace</button>
        </form>
        <p class="pie-formulario"><a href="/login">Volver a iniciar sesión</a></p>
      </div>
    </main>
  </div>
</body>
</html>
