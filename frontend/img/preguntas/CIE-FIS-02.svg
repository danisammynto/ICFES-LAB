<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="100%" role="img" aria-labelledby="titulo-cie-fis-02" font-family="Poppins, Arial, sans-serif">
  <title id="titulo-cie-fis-02">Gráfica velocidad–tiempo de un bus de TransMilenio que viaja entre dos estaciones</title>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="240" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#2b2f5e">Velocidad del bus entre dos estaciones</text>
  <text x="20" y="54" font-size="14" fill="#2b2f5e">Velocidad (m/s)</text>
  <g stroke="#81a1f6" stroke-width="1" stroke-opacity="0.55">
    <line x1="70" y1="220" x2="430" y2="220"/>
    <line x1="70" y1="190" x2="430" y2="190"/>
    <line x1="70" y1="160" x2="430" y2="160"/>
    <line x1="70" y1="130" x2="430" y2="130"/>
    <line x1="70" y1="100" x2="430" y2="100"/>
    <line x1="70" y1="70" x2="430" y2="70"/>
    <line x1="142" y1="70" x2="142" y2="250"/>
    <line x1="214" y1="70" x2="214" y2="250"/>
    <line x1="286" y1="70" x2="286" y2="250"/>
    <line x1="358" y1="70" x2="358" y2="250"/>
    <line x1="430" y1="70" x2="430" y2="250"/>
  </g>
  <g stroke="#2b2f5e" stroke-width="2" stroke-linecap="round">
    <line x1="70" y1="250" x2="446" y2="250"/>
    <line x1="70" y1="250" x2="70" y2="62"/>
  </g>
  <g font-size="14" fill="#2b2f5e" text-anchor="middle">
    <text x="70" y="270">0</text>
    <text x="142" y="270">10</text>
    <text x="214" y="270">20</text>
    <text x="286" y="270">30</text>
    <text x="358" y="270">40</text>
    <text x="430" y="270">50</text>
    <text x="250" y="293">Tiempo (s)</text>
  </g>
  <g font-size="14" fill="#2b2f5e" text-anchor="end">
    <text x="62" y="255">0</text>
    <text x="62" y="225">2</text>
    <text x="62" y="195">4</text>
    <text x="62" y="165">6</text>
    <text x="62" y="135">8</text>
    <text x="62" y="105">10</text>
    <text x="62" y="75">12</text>
  </g>
  <polyline points="70,250 142,100 358,100 430,250" fill="none" stroke="#484ea2" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#fda879" stroke="#2b2f5e" stroke-width="1.5">
    <circle cx="70" cy="250" r="5"/>
    <circle cx="142" cy="100" r="5"/>
    <circle cx="358" cy="100" r="5"/>
    <circle cx="430" cy="250" r="5"/>
  </g>
</svg>
