<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <title>Gráfica de la altura de una cometa, en metros, en función del tiempo, en minutos, durante 12 minutos de vuelo</title>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g stroke="#81a1f6" stroke-opacity="0.45" stroke-width="1">
    <line x1="60" y1="215" x2="444" y2="215"/>
    <line x1="60" y1="180" x2="444" y2="180"/>
    <line x1="60" y1="145" x2="444" y2="145"/>
    <line x1="60" y1="110" x2="444" y2="110"/>
    <line x1="60" y1="75" x2="444" y2="75"/>
    <line x1="60" y1="40" x2="444" y2="40"/>
    <line x1="92" y1="40" x2="92" y2="250"/>
    <line x1="124" y1="40" x2="124" y2="250"/>
    <line x1="156" y1="40" x2="156" y2="250"/>
    <line x1="188" y1="40" x2="188" y2="250"/>
    <line x1="220" y1="40" x2="220" y2="250"/>
    <line x1="252" y1="40" x2="252" y2="250"/>
    <line x1="284" y1="40" x2="284" y2="250"/>
    <line x1="316" y1="40" x2="316" y2="250"/>
    <line x1="348" y1="40" x2="348" y2="250"/>
    <line x1="380" y1="40" x2="380" y2="250"/>
    <line x1="412" y1="40" x2="412" y2="250"/>
    <line x1="444" y1="40" x2="444" y2="250"/>
  </g>
  <g stroke="#2b2f5e" stroke-width="2">
    <line x1="60" y1="250" x2="456" y2="250"/>
    <line x1="60" y1="250" x2="60" y2="32"/>
  </g>
  <polyline points="60,250 124,145 188,75 252,75 284,145 444,250" fill="none" stroke="#484ea2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#fda879" stroke="#2b2f5e" stroke-width="1.5">
    <circle cx="60" cy="250" r="5"/>
    <circle cx="124" cy="145" r="5"/>
    <circle cx="188" cy="75" r="5"/>
    <circle cx="252" cy="75" r="5"/>
    <circle cx="284" cy="145" r="5"/>
    <circle cx="444" cy="250" r="5"/>
  </g>
  <g font-family="Poppins, Arial, sans-serif" fill="#2b2f5e">
    <text x="252" y="22" font-size="16" font-weight="600" text-anchor="middle">Altura de la cometa</text>
    <g font-size="14" text-anchor="end">
      <text x="52" y="255">0</text>
      <text x="52" y="220">10</text>
      <text x="52" y="185">20</text>
      <text x="52" y="150">30</text>
      <text x="52" y="115">40</text>
      <text x="52" y="80">50</text>
      <text x="52" y="45">60</text>
    </g>
    <g font-size="14" text-anchor="middle">
      <text x="60" y="270">0</text>
      <text x="92" y="270">1</text>
      <text x="124" y="270">2</text>
      <text x="156" y="270">3</text>
      <text x="188" y="270">4</text>
      <text x="220" y="270">5</text>
      <text x="252" y="270">6</text>
      <text x="284" y="270">7</text>
      <text x="316" y="270">8</text>
      <text x="348" y="270">9</text>
      <text x="380" y="270">10</text>
      <text x="412" y="270">11</text>
      <text x="444" y="270">12</text>
    </g>
    <text x="252" y="292" font-size="14" text-anchor="middle">Tiempo t (minutos)</text>
    <text transform="translate(20,145) rotate(-90)" font-size="14" text-anchor="middle">Altura h (metros)</text>
  </g>
</svg>
