<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contraseña · ICFES Lab</title>
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#484ea2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/componentes.css">
  <link rel="stylesheet" href="/css/paginas/auth.css">
  <script src="/js/tema-inicial.js"></script>
  <script type="module" src="/js/paginas/restablecer.js"></script>
</head>
<body>
  <div class="pagina-auth">
    <section class="panel-marca">
      <a href="/" aria-label="ICFES Lab, página principal">
        <img class="logo-imagen" src="/img/logo-icfes-lab.png" alt="ICFES Lab" width="520" height="140">
      </a>
      <div>
        <h1>Crea una contraseña <span>nueva y segura</span>.</h1>
        <p>Por seguridad, cerraremos las sesiones abiertas en otros dispositivos.</p>
      </div>
      <img src="/img/vanty.svg" alt="" class="vanty-marca">
    </section>

    <main class="panel-formulario" id="contenido">
      <div class="caja-formulario">
        <h2>Nueva contraseña</h2>
        <p>Elige una contraseña que no uses en otros sitios.</p>
        <form class="tarjeta" id="formulario" novalidate>
          <div class="alerta alerta-error alerta-formulario oculto" role="alert" tabindex="-1"></div>
          <div class="campo">
            <label for="password">Nueva contraseña</label>
            <div class="entrada-con-icono">
              <input class="entrada" type="password" id="password" name="password" autocomplete="new-password" required minlength="8" maxlength="72">
              <button type="button" class="btn btn-fantasma btn-icono btn-sm" data-ver-password="password" aria-label="Mostrar contraseña">
                <svg class="icono" aria-hidden="true"><use href="/img/iconos.svg#eye"></use></svg>
              </button>
            </div>
            <div class="fuerza" id="fuerza" data-nivel="0" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
            <span class="campo-error" id="error-password"></span>
          </div>
          <div class="campo">
            <label for="confirmacion">Confirma la contraseña</label>
            <input class="entrada" type="password" id="confirmacion" name="confirmacion" autocomplete="new-password" required maxlength="72">
            <span class="campo-error" id="error-confirmacion"></span>
          </div>
          <button type="submit" class="btn btn-primario btn-lg btn-bloque" id="boton-enviar">Guardar contraseña</button>
        </form>
        <p class="pie-formulario"><a href="/login">Volver a iniciar sesión</a></p>
      </div>
    </main>
  </div>
</body>
</html>
